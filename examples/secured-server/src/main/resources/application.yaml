mcp:
  server:
    path: "secured"
    name: "secured-mcp-server"

server:
  port: 8081
  host: 0.0.0.0
  features:
    security:
      # protected paths on the web server
      paths:
        - path: "/secured"
          methods: [ "post", "get" ]
          authenticate: true

security:
  providers:
    - oidc:
        client-id: "mcp-client"
        client-secret: "changeit"
        identity-uri: "http://localhost:8080/realms/mcp-realm"
        audience: "mcp-scope"
        header-use: "true"
        frontend-uri: "http://localhost:6274/oauth/callback/debug"
        # Helidon 4.3.1's OidcProvider maps Role grants only from the fixed top-level "groups" access
        # token claim (Jwt.userGroups(), read when useJwtGroups is true, which is the default). There is
        # no config option to point it at a different/nested claim such as Keycloak's realm_access.roles.
        # role-protected-tool therefore relies on a Keycloak protocol mapper (see mcp-realm.json /
        # README.md) that copies the user's realm roles into that "groups" claim.
    # Required for role-protected-tool and policy-protected-tool: OIDC only authenticates the caller, it
    # does not evaluate MCP per-tool authorization metadata. Without this provider, both tools always deny.
    - abac:
